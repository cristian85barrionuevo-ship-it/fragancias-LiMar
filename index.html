<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis Fragancias Disponibles</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#faf7ff;color:#231942}header{background:#5b21b6;color:#fff;padding:18px}.wrap{max-width:1000px;margin:auto;padding:0 16px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:bold;font-size:22px}button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:#7c3aed;color:white}.light{background:white;color:#5b21b6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:22px}.card{background:#fff;border:1px solid #e8defa;border-radius:14px;padding:15px;box-shadow:0 5px 15px #31105b0d}.card h3{margin:8px 0 6px}.muted{color:#756b85;font-size:13px}.price{font-size:18px;font-weight:bold;color:#5b21b6}.stock{font-size:12px;margin:8px 0}.ok{color:#16803c}.no{color:#b42318}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.cart{position:fixed;right:18px;bottom:18px;background:#1f2937;color:#fff;padding:15px;border-radius:14px;box-shadow:0 8px 30px #0003}.panel{margin-top:32px;background:#fff;border:1px solid #e8defa;border-radius:14px;padding:18px}.hidden{display:none}input{width:100%;padding:10px;border:1px solid #ddd0ee;border-radius:8px;box-sizing:border-box;margin:4px 0 10px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:9px;border-bottom:1px solid #eee;text-align:left}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.cart{left:18px;right:18px;text-align:center}}</style></head><body><header><div class="wrap bar"><div><div class="brand">Mis Fragancias Disponibles</div><div>Catálogo · pago contra entrega</div></div><button class="light" id="adminBtn">Panel privado</button></div></header><main class="wrap"><div class="panel"><div class="row"><input id="search" placeholder="Buscar producto..."><button class="primary" id="refresh">Actualizar</button></div><div id="status" class="muted">Cargando productos...</div><div id="products" class="grid"></div></div><div id="admin" class="panel hidden"><div class="bar"><h2>Administración</h2><button id="logout" class="light">Cerrar sesión</button></div><p class="muted">Editá precio y stock. Los cambios se guardan en Supabase.</p><div id="adminTable"></div></div></main><div id="cart" class="cart hidden"></div><div id="login" class="panel hidden wrap"><h2>Ingresar al panel</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Contraseña"><button id="loginBtn" class="primary">Ingresar</button><button id="forgot" class="light">Recuperar contraseña</button><p id="loginMsg" class="muted"></p></div><script>
const API='https://sastokjxydnlujfvvagr.supabase.co',KEY='sb_publishable_3oph1JvGDTPaDlP1DRebjw_XVE4gQOi';let products=[],cart=[],token='';const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});async function api(path,opt={}){opt.headers={apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(opt.headers||{})};const r=await fetch(API+path,opt);const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}if(!r.ok)throw Error(d?.message||d?.msg||'Error');return d}async function load(){try{products=await api('/rest/v1/products?select=id,name,category,price,stock,image_url,active&active=eq.true&order=name');render()}catch(e){$('status').textContent='No se pudieron cargar los productos. Recargá la página.'}}function render(){const q=$('search').value.toLowerCase(),list=products.filter(p=>(p.name+' '+(p.category||'')).toLowerCase().includes(q));$('status').textContent=list.length+' productos disponibles';$('products').innerHTML=list.map(p=>`<article class="card"><div class="muted">${p.category||'Perfumería'}</div><h3>${p.name}</h3><div class="price">${money(p.price)}</div><div class="stock ${p.stock>0?'ok':'no'}">${p.stock>0?p.stock+' disponibles':'Sin stock'}</div><button class="primary" ${p.stock>0?'':'disabled'} onclick="add('${p.id}')">${p.stock>0?'Agregar':'Sin stock'}</button></article>`).join('')||'<p class="muted">No encontramos productos.</p>';renderCart()}function add(id){const p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(!p||p.stock<1)return;if(i){if(i.qty>=p.stock)return alert('No podés superar el stock disponible');i.qty++}else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1,stock:p.stock});renderCart()}function renderCart(){if(!cart.length)return $('cart').classList.add('hidden');$('cart').classList.remove('hidden');$('cart').innerHTML=`<b>Pedido: ${cart.reduce((s,i)=>s+i.qty,0)} producto(s) · ${money(cart.reduce((s,i)=>s+i.price*i.qty,0))}</b><br><button class="primary" onclick="checkout()">Confirmar pedido</button>`}async function checkout(){const name=prompt('Nombre completo'),phone=prompt('Teléfono'),address=prompt('Dirección o retiro en local');if(!name||!phone||!address)return;const total=cart.reduce((s,i)=>s+i.price*i.qty,0);const items=cart.map(i=>({product_id:i.id,product_name:i.name,unit_price:i.price,quantity:i.qty}));try{await api('/rest/v1/rpc/create_order_with_items',{method:'POST',body:JSON.stringify({order_data:{customer_name:name,customer_phone:phone,delivery_address:address,notes:'',total},items})})}catch(e){return alert(e.message.includes('stock_insufficient')?'No hay stock suficiente.':'No se pudo guardar el pedido.')}const text='PEDIDO Mis Fragancias Disponibles%0A%0A'+cart.map(i=>`${i.qty}x ${i.name} - ${money(i.price*i.qty)}`).join('%0A')+`%0A%0ATotal: ${money(total)}%0ACliente: ${encodeURIComponent(name)}%0ATeléfono: ${encodeURIComponent(phone)}%0AEntrega: ${encodeURIComponent(address)}%0APago: contra entrega`;cart=[];render();const box=document.createElement('div');box.className='panel wrap';box.innerHTML='<h3>Pedido guardado</h3><p>Ahora tocá el botón para abrir WhatsApp.</p><a class="btn primary" target="_blank" href="https://api.whatsapp.com/send?phone=5492634587402&text='+text+'">Abrir WhatsApp</a>';document.body.prepend(box)}async function login(){try{const d=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.access_token;$('login').classList.add('hidden');$('admin').classList.remove('hidden');admin()}catch(e){$('loginMsg').textContent='Email o contraseña incorrectos.'}}async function admin(){const data=await api('/rest/v1/products?select=id,name,price,stock,active&order=name');$('adminTable').innerHTML='<table class="table"><tr><th>Producto</th><th>Precio</th><th>Stock</th><th></th></tr>'+data.map(p=>`<tr><td>${p.name}</td><td><input id="p${p.id}" type="number" value="${p.price}"></td><td><input id="s${p.id}" type="number" min="0" value="${p.stock}"></td><td><button class="primary" onclick="save('${p.id}')">Guardar</button></td></tr>`).join('')+'</table>'}async function save(id){try{await api('/rest/v1/products?id=eq.'+id,{method:'PATCH',body:JSON.stringify({price:Number($('p'+id).value),stock:Math.max(0,Number($('s'+id).value)),updated_at:new Date().toISOString()})});alert('Guardado');load();admin()}catch(e){alert('No se pudo guardar. Verificá tu sesión.')}}$('search').oninput=render;$('refresh').onclick=load;$('adminBtn').onclick=()=>{$('login').classList.toggle('hidden')};$('loginBtn').onclick=login;$('logout').onclick=()=>{token='';$('admin').classList.add('hidden')};$('forgot').onclick=async()=>{try{await api('/auth/v1/recover',{method:'POST',body:JSON.stringify({email:$('email').value.trim()})});$('loginMsg').textContent='Revisá tu correo.'}catch(e){$('loginMsg').textContent='No se pudo enviar el correo.'}};load();
</script></body></html>
